# Strict linting (`make lint` runs with --strict: every warning fails).
# Limits are tuned to the codebase's deliberate style rather than left at
# defaults — the rules that matter are the correctness-adjacent ones.

excluded:
  - .build
  - build
  - Sources/CSpeexDSP
  - Sources/MachTaskSelfWrapper
  - Sources/FastClusterWrapper

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - last_where
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

# Tight scopes use short names on purpose (`i`, `t`, `f`); casing rules still apply.
identifier_name:
  min_length: 1

# Multiline literals keep trailing commas (smaller diffs).
trailing_comma:
  mandatory_comma: true

line_length:
  warning: 120
  error: 140

# The prompt template and the pipeline's stage list are single cohesive
# functions; splitting them for the counter's sake would hurt readability.
function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 500
  error: 650

file_length:
  warning: 700
  error: 1000

# DictationGesture is an exhaustive keystroke state machine — its complexity
# is the domain's, and every branch is unit-tested.
cyclomatic_complexity:
  warning: 15

large_tuple:
  warning: 3
  error: 4
